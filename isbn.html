<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>本ISBN読み取り</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #f4f4f4; color: #222; }
  header { background: #1565c0; color: #fff; padding: 12px 16px; font-size: 16px; font-weight: bold; }
  main { padding: 12px 16px 60px; }
  .boxrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .boxrow label { font-weight: bold; white-space: nowrap; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; font-size: 20px; border: 2px solid #999; border-radius: 10px; background: #fff; }
  .cam { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 8%; right: 8%; top: 38%; height: 24%; border: 3px solid #ffeb3b; border-radius: 8px; pointer-events: none; }
  .hint { position: absolute; left: 8%; right: 8%; top: 38%; transform: translateY(-120%); text-align: center; font-size: 12px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
  .ocrrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: #555; }
  .ocrrow button { border: 0; border-radius: 8px; background: #78909c; color: #fff; font-size: 13px; padding: 6px 10px; }
  .ocrrow button:disabled { background: #b0bec5; }
  .flash { position: absolute; inset: 0; background: #00e676; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .flash.on { opacity: .7; transition: none; }
  .btn { display: block; width: 100%; padding: 20px 0; margin-top: 10px; border: 0; border-radius: 14px; background: #1e88e5; color: #fff; font-size: 22px; font-weight: bold; }
  .btn:active { background: #1565c0; }
  .btn:disabled { background: #b0bec5; }
  .btn.sub { background: #78909c; font-size: 18px; padding: 14px 0; }
  .btn.small { width: auto; margin: 0; padding: 12px 18px; font-size: 18px; }
  .msg { margin-top: 8px; font-size: 15px; color: #c62828; min-height: 20px; }
  .fatal { display: none; margin-top: 8px; padding: 12px; background: #c62828; color: #fff; font-weight: bold; border-radius: 10px; }
  .total { margin: 12px 0 4px; font-size: 18px; }
  .total b { font-size: 48px; }
  .status { font-size: 14px; color: #555; }
  .status.warn { color: #e65100; font-weight: bold; }
  .manual { margin-top: 14px; }
  .manual .boxrow { margin-bottom: 4px; }
  .manual .err { color: #c62828; font-size: 14px; min-height: 18px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; font-size: 16px; }
  li.canceled { opacity: .45; text-decoration: line-through; }
  li .isbn { font-weight: bold; letter-spacing: 1px; }
  li .t { color: #666; font-size: 13px; }
  li .r { text-align: right; font-size: 14px; min-width: 0; }
  li .r b { font-size: 16px; }
  li .pend { color: #e65100; }
</style>
</head>
<body>
<header>本ISBN読み取り</header>
<main>
  <div class="boxrow"><label for="box">棚番号</label><input type="text" id="box" placeholder="例 A-01" autocomplete="off" autocapitalize="characters"></div>
  <div class="cam">
    <video id="v" playsinline muted autoplay></video>
    <div class="frame"></div>
    <div class="hint">バーコード、またはISBNの数字の行を枠に入れてください</div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="ocrrow"><span>文字読み取り: <b id="ocrSt">未開始</b></span><button type="button" id="ocrTg" disabled>止める</button></div>
  <button class="btn" id="start">開始</button>
  <div class="msg" id="msg"></div>
  <div class="fatal" id="fatal"></div>
  <div class="total">合計 <b id="total">0</b> 冊 <span class="status" id="status"></span></div>
  <div class="manual">
    <div class="boxrow">
      <input type="text" id="man" inputmode="numeric" placeholder="ISBNを手入力" autocomplete="off" maxlength="80">
      <button class="btn small" id="manX" type="button">X</button>
      <button class="btn small" id="manAdd" type="button">追加</button>
    </div>
    <div class="err" id="manErr"></div>
  </div>
  <button class="btn sub" id="undo">直前を取消</button>
  <ul id="list" style="margin-top:10px"></ul>
</main>

<script type="module">
// barcode-detector 3.2.3（zxing-wasm を使う ponyfill）。wasm も同バージョンに固定
import { BarcodeDetector, ZXING_WASM_VERSION, prepareZXingModule }
  from "https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/es/ponyfill.js";

prepareZXingModule({
  overrides: {
    locateFile: (path, prefix) => path.endsWith(".wasm")
      ? `https://cdn.jsdelivr.net/npm/zxing-wasm@${ZXING_WASM_VERSION}/dist/reader/${path}`
      : prefix + path,
  },
});

const GAS_URL = "https://script.google.com/macros/s/AKfycbzkIpGLyskgxgIrUBHNziBQjgC8IzS6SKha1NuvwaSxVvypiqQxzlK4AgXK-efrbTDYxA/exec";
const TIMEOUT_MS = 30000;
const REARM_MS = 1500;       // そのISBNが枠から消えて1.5秒たったら次の冊として読める
const MAX_ITEMS = 50;

const detector = new BarcodeDetector({ formats: ["ean_13"] });
const $ = id => document.getElementById(id);
const video = $("v");
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// ---- 合言葉（#k=... を保存。ブックマーク・ホーム画面追加用に URL の # は残す） ----
let K = "";
function readKey() {
  const h = new URLSearchParams(location.hash.slice(1)).get("k");
  if (h) safeSet("isbn_k", h);
  K = h || safeGet("isbn_k") || K;
}
readKey();

// ---- ISBN ----
function isIsbn13(s) {
  if (typeof s !== "string" || !/^\d{13}$/.test(s) || !/^97[89]/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += Number(s[i]) * (i % 2 ? 3 : 1);
  return (10 - sum % 10) % 10 === Number(s[12]);
}
function isIsbn10(s) {
  if (!/^\d{9}[\dX]$/.test(s)) return false;
  let sum = 0;
  for (let i = 0; i < 10; i++) sum += (10 - i) * (s[i] === "X" ? 10 : Number(s[i]));
  return sum % 11 === 0;
}
function isbn10to13(s) {
  const b = "978" + s.slice(0, 9);
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += Number(b[i]) * (i % 2 ? 3 : 1);
  return b + ((10 - sum % 10) % 10);
}
// 手入力 -> {isbn} か {error}
function parseManual(raw) {
  // 全角→半角。iPhoneの「テキストをスキャン」で「ISBN4-10-101001-3 C0193 ¥400E」のように拾った場合は ISBN の直後だけ使う
  let t = String(raw).replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).toUpperCase();
  const m = t.match(/I\s*S\s*B\s*N[\s:：]*([\dX\-‐ー－\s]+)/);
  if (m) t = m[1];
  const s = t.replace(/[\s\-‐ー－]/g, "");
  if (!s) return { error: "ISBNを入力してください" };
  if (!/^[\dX]+$/.test(s)) return { error: "数字（とXだけ）で入力してください" };
  if (s.length === 10) {
    if (!isIsbn10(s)) return { error: "10桁ISBNの検算が合いません。打ち間違いがないか確認してください" };
    return { isbn: isbn10to13(s) };
  }
  if (s.length === 13) {
    if (!/^\d{13}$/.test(s)) return { error: "13桁にXは使えません" };
    if (!/^97[89]/.test(s)) return { error: "13桁は978か979で始まる必要があります（バーコード上段のISBNです）" };
    if (!isIsbn13(s)) return { error: "13桁ISBNの検算が合いません。打ち間違いがないか確認してください" };
    return { isbn: s };
  }
  return { error: "10桁か13桁で入力してください（今 " + s.length + " 桁）" };
}

// OCR文字列 -> {isbn, tagged} か null。parseManual とは別。誤登録防止のため日本の本（9784 / 4始まり）＋検算が合うものだけ
function extractOcrIsbn(text) {
  const lines = String(text || "").split(/\r?\n/);
  let untagged = null;
  for (const line of lines) {
    const s = line
      .replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .toUpperCase().replace(/[×✕]/g, "X")
      .replace(/[\s\-‐‑‒–—―ー－−­]/g, "");
    // ISBN の直後（OCRで 1SBN / LSBN / ISBM になることがある）
    const tagRe = /[I1L|!][S5$][B8][NM]/g;
    let m;
    while ((m = tagRe.exec(s))) {
      const run = (s.slice(tagRe.lastIndex).match(/^[\dX]+/) || [""])[0];
      const a = run.slice(0, 13);
      if (a.length === 13 && /^9784\d{9}$/.test(a) && isIsbn13(a)) return { isbn: a, tagged: true };
      const b = run.slice(0, 10);
      if (b.length === 10 && /^4/.test(b) && isIsbn10(b)) return { isbn: isbn10to13(b), tagged: true };
    }
    // ISBN の文字が読めなかった行: 13桁は窓でずらして探す。10桁は4始まりでちょうど10桁のときだけ
    if (!untagged) {
      for (const run of s.match(/[\dX]+/g) || []) {
        for (let i = 0; i + 13 <= run.length; i++) {
          const a = run.slice(i, i + 13);
          if (/^9784\d{9}$/.test(a) && isIsbn13(a)) { untagged = { isbn: a, tagged: false }; break; }
        }
        if (untagged) break;
        // 10桁は並びがちょうど10桁のときだけ（JANコード491…等の先頭10桁を誤って拾わないため）
        if (run.length === 10 && /^4/.test(run) && isIsbn10(run)) { untagged = { isbn: isbn10to13(run), tagged: false }; break; }
      }
    }
  }
  return untagged;
}
window.__t = { isIsbn13, isIsbn10, isbn10to13, parseManual, extractOcrIsbn };

function newUuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.prototype.map.call(b, x => ("0" + x.toString(16)).slice(-2)).join("");
  return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
}

// ---- 状態 ----
let items = [];            // 古い順 {uuid, ts, isbn, box, state:'pending'|'sent', copy, title, canceled, cancelPending}
let pending = [];          // 送信キュー（古い順）{qid, action, uuid, isbn, box, ts, seq, attempt}
let seq = Date.now();
let sending = false, retryTimer = null, fatal = false;
let db = null;
let count = { d: "", n: 0 };

function today() { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
function loadLocal() {
  try { const a = JSON.parse(safeGet("isbn_items")); if (Array.isArray(a)) items = a; } catch (e) {}
  try { const c = JSON.parse(safeGet("isbn_count")); if (c && typeof c.n === "number") count = c; } catch (e) {}
  if (count.d !== today()) count = { d: today(), n: 0 };
}
function saveLocal() {
  if (items.length > MAX_ITEMS) {
    const keep = [];
    let extra = items.length - MAX_ITEMS;
    for (const it of items) {
      if (extra > 0 && it.state === "sent" && !it.cancelPending) extra--; else keep.push(it);
    }
    items = keep;
  }
  safeSet("isbn_items", JSON.stringify(items));
  safeSet("isbn_count", JSON.stringify(count));
}

// ---- IndexedDB（未送信キューを端末に保持。iOSで接続が切れても繋ぎ直す。決して reject しない） ----
function openDb() {
  return new Promise(function (resolve) {
    try {
      const req = indexedDB.open("isbn_queue", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("q", { keyPath: "qid" }); };
      req.onsuccess = function () {
        const d = req.result;
        d.onclose = function () { if (db === d) db = null; };
        d.onversionchange = function () { d.close(); if (db === d) db = null; };
        resolve(d);
      };
      req.onerror = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
}
function withStore(mode, fn) {
  function run(retry) {
    const ready = db ? Promise.resolve(db) : openDb().then(function (d) { db = d; return d; });
    return ready.then(function (d) {
      if (!d) return { ok: false };
      return new Promise(function (res) {
        function again() { if (db === d) { try { d.close(); } catch (e) {} db = null; } res(retry ? run(false) : { ok: false }); }
        try {
          const tx = d.transaction("q", mode);
          const out = fn(tx.objectStore("q")) || {};
          tx.oncomplete = function () { res({ ok: true, value: out.value }); };
          tx.onerror = tx.onabort = again;
        } catch (e) { again(); }
      });
    });
  }
  return run(true);
}
function dbPut(rec) {
  return withStore("readwrite", function (s) { s.put(rec); }).then(function () {
    return withStore("readonly", function (s) {
      const box = { value: false };
      s.count(rec.qid).onsuccess = function (e) { box.value = e.target.result === 1; };
      return box;
    });
  }).then(function (r) { return r.ok && r.value === true; });
}
function dbDel(qid) { return withStore("readwrite", function (s) { s.delete(qid); }); }
function dbLoad() {
  return withStore("readonly", function (s) {
    const box = { value: [] };
    s.openCursor().onsuccess = function (e) {
      const c = e.target.result;
      if (c) { box.value.push(c.value); c.continue(); }
    };
    return box;
  }).then(function (r) { return r.value || []; });
}
function resetDb() { if (db) { try { db.close(); } catch (e) {} db = null; } }

// ---- 通信（Content-Type を付けず CORS の事前確認を避ける） ----
function api(action, body) {
  body.action = action; body.k = K;
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
  return fetch(GAS_URL, { method: "POST", body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined, redirect: "follow" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (r) {
      clearTimeout(timer);
      if (r.ok === false && r.error) { const e = new Error(r.error); e.fatal = !!r.fatal; throw e; }
      return r;
    }, function (e) { clearTimeout(timer); throw e.name === "AbortError" ? new Error("タイムアウト") : e; });
}

// ---- 画面 ----
function showMsg(t) { $("msg").textContent = t || ""; }
function render() {
  $("total").textContent = count.n;
  const st = $("status");
  st.textContent = pending.length ? "未送信 " + pending.length + " 件" + (K ? "" : "（合言葉なし：専用URLで開き直すと送信）") : (items.length ? "送信済み" : "");
  st.className = "status" + (pending.length ? " warn" : "");
  const ul = $("list");
  ul.textContent = "";
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const li = document.createElement("li");
    if (it.canceled) li.className = "canceled";
    const l = document.createElement("span");
    const t = document.createElement("div"); t.className = "t";
    const d = new Date(it.ts);
    t.textContent = isNaN(d) ? "" : d.toTimeString().slice(0, 8) + "  棚 " + (it.box || "-");
    const n = document.createElement("div"); n.className = "isbn"; n.textContent = it.isbn;
    l.append(t, n);
    const r = document.createElement("span"); r.className = "r";
    if (it.canceled) r.textContent = it.cancelPending ? "取消（送信待ち）" : "取消";
    else if (it.state === "sent") {
      const b = document.createElement("b"); b.textContent = it.copy + "冊目";
      const tt = document.createElement("div"); tt.textContent = it.title || "書名不明";
      r.append(b, tt);
    } else { r.className = "r pend"; r.textContent = "送信待ち"; }
    li.append(l, r);
    ul.appendChild(li);
  }
  // 合言葉が無くても読み取りは止めない（端末に貯めて、専用URLで開き直したら送信）
  $("start").disabled = fatal;
  $("manAdd").disabled = fatal;
}
function stopFatal(m) {
  fatal = true; running = false;
  const f = $("fatal"); f.style.display = "block"; f.textContent = "停止しました: " + m;
  render();
}

// ---- 送信キュー（1件ずつ。失敗は自動再送。同じUUIDはサーバー側で二重登録されない） ----
function enqueue(rec) {
  rec.qid = rec.action === "cancel" ? "c-" + rec.uuid : rec.uuid;
  rec.seq = ++seq; rec.attempt = 0;
  pending.push(rec);
  render();
  return dbPut(rec);
}
function findItem(uuid) { return items.find(x => x.uuid === uuid); }
function pump() {
  if (sending || fatal || !K || !pending.length) return;
  clearTimeout(retryTimer);
  sending = true;
  const rec = pending[0];
  rec.attempt++;
  const body = rec.action === "cancel" ? { uuid: rec.uuid } : { uuid: rec.uuid, isbn: rec.isbn, box: rec.box, ts: rec.ts };
  api(rec.action, body).then(function (r) {
    pending.shift();
    const it = findItem(rec.uuid);
    if (it) {
      if (rec.action === "add") { it.state = "sent"; it.copy = r.copy; it.title = r.title || ""; }
      else it.cancelPending = false;
    }
    saveLocal(); showMsg("");
    return dbDel(rec.qid).then(function () { sending = false; render(); pump(); });
  }, function (err) { onFail(rec, err); });
  render();
}
function onFail(rec, err) {
  sending = false;
  if (err && err.fatal) { stopFatal(err.message); return; }
  showMsg("送信に失敗しました。自動で再送します（" + ((err && err.message) || err) + "）");
  retryTimer = setTimeout(pump, Math.min(30000, 3000 * Math.pow(2, Math.min(rec.attempt - 1, 4))));
  render();
}
window.addEventListener("online", pump);
document.addEventListener("visibilitychange", function () { if (!document.hidden) { resetDb(); pump(); } });
window.addEventListener("pageshow", pump);
window.addEventListener("beforeunload", function (e) { if (pending.length) { e.preventDefault(); e.returnValue = ""; } });

// ---- 確定 ----
let audioCtx = null, stream = null, running = false;
function beep() {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 1000; g.gain.value = 0.2;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.1);
  } catch (e) {}
}
function flash() { const f = $("flash"); f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 80); }

function getBox() { return $("box").value.trim(); }
function accept(isbn) {
  if (fatal) return false;
  const box = getBox();
  if (!box) { showMsg("棚番号を入力してください"); return false; }
  if (count.d !== today()) count = { d: today(), n: 0 };
  const it = { uuid: newUuid(), ts: new Date().toISOString(), isbn, box, state: "pending", copy: 0, title: "", canceled: false, cancelPending: false };
  items.push(it);
  count.n++;
  saveLocal(); render(); beep(); flash();
  enqueue({ action: "add", uuid: it.uuid, isbn, box, ts: it.ts }).then(function (stored) {
    if (!stored) showMsg("端末に保存できませんでした。送信が終わるまで画面を閉じないでください");
    pump();
  });
  return true;
}

$("undo").addEventListener("click", function () {
  let i = items.length - 1;
  while (i >= 0 && items[i].canceled) i--;
  if (i < 0) return;
  const it = items[i];
  const qi = pending.findIndex(q => q.qid === it.uuid);
  const inFlight = qi === 0 && sending;
  if (qi >= 0 && !inFlight) {
    // まだ送っていない: キューから外して一覧からも消す
    const q = pending.splice(qi, 1)[0];
    dbDel(q.qid);
    items.splice(i, 1);
  } else {
    // 送信済み（または送信中）: 取消をキューで送る。行は残してグレーアウト
    it.canceled = true; it.cancelPending = true;
    enqueue({ action: "cancel", uuid: it.uuid }).then(pump);
  }
  if (count.n > 0) count.n--;
  saveLocal(); render();
});

// ---- 手入力 ----
function manualAdd() {
  const err = $("manErr");
  err.textContent = "";
  const r = parseManual($("man").value);
  if (r.error) { err.textContent = r.error; return; }
  if (!getBox()) { err.textContent = "棚番号を入力してください"; $("box").focus(); return; }
  if (accept(r.isbn)) $("man").value = "";
}
$("manAdd").addEventListener("click", manualAdd);
$("man").addEventListener("keydown", function (e) { if (e.key === "Enter") manualAdd(); });
$("manX").addEventListener("click", function () { const m = $("man"); m.value += "X"; m.focus(); });

$("box").value = safeGet("isbn_box") || "";
$("box").addEventListener("input", function () { safeSet("isbn_box", $("box").value.trim()); });

// ---- カメラ読み取り ----
// 同じISBNは「検出されなくなって1.5秒たってから」再び読めたら次の冊。かざしっぱなしでは増えない
let lastRaw = null;
let lastBarcodeAt = 0;     // 何かバーコードを検出した最後の時刻（OCRはこれが500ms以上前のときだけ動く）
const detCanvas = document.createElement("canvas");
const detCtx = detCanvas.getContext("2d");
// 高解像度のカメラ映像はバーコード検出に重いので、検出側へは幅1280までに縮めて渡す
function detSource() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!detCtx || !vw || !vh || Math.max(vw, vh) <= 1280) return video;
  const k = 1280 / Math.max(vw, vh);
  const dw = Math.round(vw * k), dh = Math.round(vh * k);
  if (detCanvas.width !== dw || detCanvas.height !== dh) { detCanvas.width = dw; detCanvas.height = dh; }
  detCtx.drawImage(video, 0, 0, detCanvas.width, detCanvas.height);
  return detCanvas;
}
const lastSeen = {};       // isbn -> 最後に検出した時刻(ms)
const armed = {};          // isbn -> false の間は確定済みで、外されるのを待っている
async function loop() {
  if (!running) return;
  const t0 = performance.now();
  try {
    if (video.readyState >= 2) {
      const res = await detector.detect(detSource());
      const now = Date.now();
      if (res.length) lastBarcodeAt = now;
      const found = res.map(r => r.rawValue).filter(isIsbn13);
      for (const k of Object.keys(armed)) if (armed[k] === false && now - (lastSeen[k] || 0) >= REARM_MS) armed[k] = true;
      const cand = found[0] || null;
      found.forEach(f => { lastSeen[f] = now; });
      if (cand && cand === lastRaw && armed[cand] !== false) {
        if (accept(cand)) armed[cand] = false;
        lastRaw = null;
      } else lastRaw = cand;
    }
  } catch (e) { lastRaw = null; }
  setTimeout(loop, Math.max(0, 160 - (performance.now() - t0)));
}

// ---- 文字読み取り（OCR）。tesseract.js 7.0.0 を「開始」後に遅延読み込み。失敗してもバーコードは今まで通り ----
const TJS = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/";
const OCR_OPTS = {
  workerPath: TJS + "worker.min.js",
  corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0",
  langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int",
  gzip: true,
  logger: function () {},
  errorHandler: function () {},
};
const OCR_MIN_GAP = 700;       // OCR開始間隔の下限(ms)。毎秒1.4回まで
const OCR_QUIET = 500;         // 直近これだけバーコードが無いときだけ動く
const OCR_HOLD = 2500;         // OCRで見えた本は、見えなくなってから 1.5+2.5 秒たつまで同じ本を数えない
let ocrPrevStart = 0, ocrHold = OCR_HOLD;
let ocrWorker = null, ocrState = "idle", ocrOn = true, ocrBusy = false, ocrLast = null, ocrPsm = "7";
const ocrCanvas = document.createElement("canvas");
function setOcrUi() {
  const label = { idle: "未開始", loading: "準備中", ready: "使えます", failed: "使えません" }[ocrState];
  $("ocrSt").textContent = label + (ocrState === "ready" && !ocrOn ? "（停止中）" : "");
  const tg = $("ocrTg");
  tg.disabled = ocrState !== "ready";
  tg.textContent = ocrOn ? "止める" : "再開";
}
$("ocrTg").addEventListener("click", function () { ocrOn = !ocrOn; ocrLast = null; setOcrUi(); });

// 黄色い枠（.frame）に当たる範囲を映像座標で返す（video は object-fit: cover）
function frameRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const cam = video.parentElement, cw = cam.clientWidth || 4, ch = cam.clientHeight || 3;
  const sc = Math.max(cw / vw, ch / vh);
  const ox = (vw - cw / sc) / 2, oy = (vh - ch / sc) / 2;
  const fl = 0.08, ft = 0.38, fw = 0.84, fh = 0.24;
  return { x: ox + fl * cw / sc, y: oy + ft * ch / sc, w: fw * cw / sc, h: fh * ch / sc };
}
// 切り出し -> 幅約OCR_W に拡大縮小 -> グレースケール -> 局所平均で二値化（影・ムラに強い）
const OCR_W = 1100;
function prepForOcr(src, r) {
  const k = Math.min(3, OCR_W / r.w);
  const w = Math.max(1, Math.round(r.w * k)), h = Math.max(1, Math.round(r.h * k));
  ocrCanvas.width = w; ocrCanvas.height = h;
  const c = ocrCanvas.getContext("2d", { willReadFrequently: true });
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
  c.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, w, h);
  const img = c.getImageData(0, 0, w, h), d = img.data;
  const g = new Float32Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = d[j] * 0.299 + d[j + 1] * 0.587 + d[j + 2] * 0.114;
  // 積分画像
  const W = w + 1, I = new Float64Array(W * (h + 1));
  for (let y = 0; y < h; y++) {
    let row = 0;
    for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + row; }
  }
  const R = Math.max(8, Math.round(h / 4));      // 局所窓の半径
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - R), y1 = Math.min(h, y + R + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - R), x1 = Math.min(w, x + R + 1);
      const mean = (I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0]) / ((x1 - x0) * (y1 - y0));
      const v = g[y * w + x] < mean * 0.85 ? 0 : 255;
      const j = (y * w + x) * 4; d[j] = d[j + 1] = d[j + 2] = v; d[j + 3] = 255;
    }
  }
  return bmp24(img);
}
// canvas.toBlob(PNG) は遅いことがあるので、24bit BMP を自前で作って渡す（tesseract.js が読める）
function bmp24(img) {
  const w = img.width, h = img.height, d = img.data, rs = (w * 3 + 3) & ~3, sz = 54 + rs * h;
  const b = new Uint8Array(sz), v = new DataView(b.buffer);
  b[0] = 66; b[1] = 77; v.setUint32(2, sz, true); v.setUint32(10, 54, true); v.setUint32(14, 40, true);
  v.setInt32(18, w, true); v.setInt32(22, h, true); v.setUint16(26, 1, true); v.setUint16(28, 24, true); v.setUint32(34, rs * h, true);
  for (let y = 0; y < h; y++) {
    let o = 54 + (h - 1 - y) * rs;
    for (let x = 0; x < w; x++) { const j = (y * w + x) * 4; b[o++] = d[j + 2]; b[o++] = d[j + 1]; b[o++] = d[j]; }
  }
  return b;
}
async function ocrRecognize(bytes, psm) {
  if (psm && psm !== ocrPsm) { await ocrWorker.setParameters({ tessedit_pageseg_mode: psm }); ocrPsm = psm; }
  const r = await ocrWorker.recognize(bytes);
  return r.data.text || "";
}
window.__startOcr = () => startOcr();
async function startOcr() {
  if (ocrState !== "idle") return;
  ocrState = "loading"; setOcrUi();
  try {
    const mod = await import(TJS + "tesseract.esm.min.js");
    const T = mod.createWorker ? mod : (mod.default || mod);
    ocrWorker = await T.createWorker("eng", 1, OCR_OPTS);
    await ocrWorker.setParameters({ tessedit_pageseg_mode: "7", tessedit_char_whitelist: "ISBN0123456789-X", preserve_interword_spaces: "1" });
    ocrPsm = "7";
    ocrState = "ready";
    window.__ocr = { prepForOcr, ocrRecognize, extractOcrIsbn, frameRect, detector, worker: ocrWorker };
    setTimeout(ocrLoop, OCR_MIN_GAP);
  } catch (e) {
    ocrState = "failed"; ocrWorker = null;
  }
  setOcrUi();
}
async function ocrLoop() {
  const t0 = Date.now();
  if (ocrState === "ready" && ocrOn && running && !ocrBusy && !document.hidden && video.readyState >= 2 && video.videoWidth && t0 - lastBarcodeAt >= OCR_QUIET) {
    ocrBusy = true;
    // 端末が遅くてOCRの間隔が延びても、同じ本を数え直さないよう保持時間を間隔の2倍（2.5〜5秒）に合わせる
    if (ocrPrevStart) ocrHold = Math.min(5000, Math.max(OCR_HOLD, 2 * (t0 - ocrPrevStart)));
    ocrPrevStart = t0;
    try {
      const text = await ocrRecognize(prepForOcr(video, frameRect()));
      const now = Date.now();
      const ex = extractOcrIsbn(text);
      if (ex && now - lastBarcodeAt >= OCR_QUIET) {
        const isbn = ex.isbn;
        // 同じ本を数え続けない: バーコードと同じ armed / lastSeen を共用（OCRは見えている間 lastSeen を未来側へ延ばす）
        for (const k of Object.keys(armed)) if (armed[k] === false && now - (lastSeen[k] || 0) >= REARM_MS) armed[k] = true;
        lastSeen[isbn] = now + ocrHold;
        if (ocrLast === isbn && armed[isbn] !== false) {
          if (accept(isbn)) armed[isbn] = false;
          ocrLast = null;
        } else ocrLast = isbn;
      } else ocrLast = null;
    } catch (e) { ocrLast = null; }
    ocrBusy = false;
  }
  setTimeout(ocrLoop, Math.max(100, OCR_MIN_GAP - (Date.now() - t0)));
}

$("start").addEventListener("click", async function () {
  showMsg("");
  if (!getBox()) { showMsg("先に棚番号を入力してください"); $("box").focus(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AC) audioCtx = new AC();
    if (audioCtx) await audioCtx.resume();
  } catch (e) {}
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    if (!running) { running = true; loop(); }
    startOcr();
    $("start").textContent = "再開始";
  } catch (e) {
    showMsg("カメラを使えません: " + (e && e.message || e));
  }
});

// ---- 起動 ----
loadLocal();
const NO_KEY_MSG = "合言葉が無いため送信できません。読み取りはできます（この端末に保存）。専用URLで開き直すと送信します";
if (!K) showMsg(NO_KEY_MSG);
window.addEventListener("hashchange", function () {
  const had = K; readKey();
  if (K && !had) { showMsg(""); render(); pump(); }
});
render();
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
dbLoad().then(function (recs) {
  recs.sort((a, b) => a.seq - b.seq);
  const have = new Set(pending.map(q => q.qid));
  recs.forEach(q => { if (!have.has(q.qid)) pending.push(q); });
  // 端末の保存が消えていても、一覧に残る未送信分は作り直す（add はUUIDで二重登録されない）
  const qids = new Set(pending.map(q => q.qid));
  items.forEach(function (it) {
    if (it.state === "pending" && !qids.has(it.uuid)) { it.seq = ++seq; pending.push({ qid: it.uuid, action: "add", uuid: it.uuid, isbn: it.isbn, box: it.box, ts: it.ts, seq, attempt: 0 }); }
    if (it.cancelPending && !qids.has("c-" + it.uuid)) pending.push({ qid: "c-" + it.uuid, action: "cancel", uuid: it.uuid, seq: ++seq, attempt: 0 });
  });
  pending.sort((a, b) => a.seq - b.seq);
  render(); pump();
});
</script>
